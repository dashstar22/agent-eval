[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "agenteval"
version = "0.1.0"
description = "AgentEval：有界 Agent 接入、数据管理与不可变评测输入"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pymysql==1.2.4",
    "sqlalchemy==2.0.52",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[project.scripts]
agenteval-probe = "agenteval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
